name: Android debug verification
on:
  push:
  pull_request:
permissions:
  contents: read
jobs:
  debug:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: npm
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '21'
      - uses: android-actions/setup-android@v3
      - run: sdkmanager 'platforms;android-36' 'build-tools;36.0.0'
      - run: npm ci
      - run: npm test
      - run: python3 tests/sqlite_migrations.py
      - run: php tests/backend.php && php scripts/lint.php
      - run: npm run android:sync
      - run: chmod +x android/gradlew && cd android && ./gradlew assembleDebug testDebugUnitTest --no-daemon
      - uses: actions/upload-artifact@v4
        with:
          name: SalahGuard-debug
          path: android/app/build/outputs/apk/debug/app-debug.apk
